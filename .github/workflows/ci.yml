name: "CI"

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: Zig Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        # version 留空：自动采用 build.zig.zon 的 minimum_zig_version（单一事实来源）
      - name: Check formatting
        run: zig fmt --check .

  test:
    name: Zig Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        # version 留空：自动采用 build.zig.zon 的 minimum_zig_version（单一事实来源）
      - name: Run tests
        run: zig build test
